<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4efdf" />
  <title>Anndriya & Arbin — Betrothal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">
  <style>
    :root { --ivory:#f4efdf; --cream:#fbf8ed; --green:#4d6047; --gold:#b79a5a; --ink:#314034; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; font-family:'Cormorant Garamond',Georgia,serif; color:var(--ink); background:var(--cream); }
    .opening { position:fixed; inset:0; z-index:20; display:grid; place-items:center; overflow:hidden; background:radial-gradient(ellipse at center,#ebe4d2 0,#cfc5ac 100%); transition:opacity .8s,visibility .8s; }
    .opening::before { content:""; position:absolute; inset:0; opacity:.2; background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E"); pointer-events:none; }
    .opening.open { opacity:0; visibility:hidden; }
    .envelope { position:relative; width:min(82vw,520px); aspect-ratio:1.35; background:linear-gradient(145deg,#fffdf4,#eee6d0); border:1px solid #d5c9a9; border-radius:3px; box-shadow:0 28px 65px #514a3d55,0 0 0 8px #f4efdf44; cursor:pointer; }
    .envelope::before { content:""; position:absolute; inset:12px; border:1px solid #caba91; pointer-events:none; }
    .envelope::after { content:""; position:absolute; inset:0; background:linear-gradient(135deg,transparent 49.7%,#e7dec7 50%,transparent 50.5%),linear-gradient(225deg,transparent 49.7%,#eee6d2 50%,transparent 50.5%); pointer-events:none; }
    .flap { position:absolute; inset:0; z-index:1; clip-path:polygon(0 0,100% 0,50% 62%); background:linear-gradient(160deg,#f8f3e5,#e8dfc7); transform-origin:top; transition:transform 1s cubic-bezier(.6,0,.2,1); filter:drop-shadow(0 2px 2px #8f805733); }
    .opening.open .flap { transform:rotateX(180deg); }
    .seal { position:absolute; z-index:2; left:50%; top:54%; width:92px; aspect-ratio:1; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle at 34% 28%,#e0d19a,#b39852 58%,#806632); color:#fff9e8; display:grid; place-items:center; border:6px double #d5c28a; box-shadow:0 5px 12px #0003,inset 0 0 8px #74602c66; }
    .seal span { font-family:'Great Vibes',cursive; font-size:42px; line-height:1; text-shadow:0 1px 2px #725927; transform:translateY(-2px); }
    .touch { position:absolute; bottom:-62px; width:100%; text-align:center; color:#fffdf2; font-size:14px; letter-spacing:3px; text-transform:uppercase; text-shadow:0 1px 5px #0009; }
    .invite { min-height:100vh; background-color:#f8f4e8; background-image:radial-gradient(ellipse at 15% 10%,#a7a18422,transparent 35%),radial-gradient(ellipse at 85% 90%,#7280641c,transparent 38%); padding:60px 20px; text-align:center; overflow:hidden; }
    .frame { position:relative; max-width:760px; margin:auto; min-height:calc(100vh - 120px); border:1px solid #aab09a; padding:70px 32px 58px; box-shadow:inset 0 0 35px #8e815312; }
    .frame::before { content:""; position:absolute; inset:8px; border:1px solid #c7b88c; pointer-events:none; }
    .vine { position:absolute; width:190px; height:250px; opacity:.45; }
    .vine.top { top:-18px; left:-25px; }.vine.bottom { bottom:-18px; right:-25px; transform:rotate(180deg); }
    .leaf { position:absolute; width:55px; height:25px; border:2px solid var(--green); border-radius:100% 0 100% 0; }
    .leaf:nth-child(1){left:40px;top:20px}.leaf:nth-child(2){left:75px;top:55px;transform:rotate(35deg)}.leaf:nth-child(3){left:25px;top:85px;transform:rotate(-35deg)}.leaf:nth-child(4){left:92px;top:125px;transform:rotate(55deg)}.leaf:nth-child(5){left:45px;top:160px;transform:rotate(-20deg)}
    .eyebrow { margin:0 0 18px; font-size:16px; letter-spacing:5px; text-transform:uppercase; color:#7c825d; }
    h1 { margin:12px auto 8px; max-width:620px; font-family:'Great Vibes',cursive; font-size:clamp(50px,9vw,84px); line-height:1.08; font-weight:400; }
    h1 em { display:block; margin:4px 0; color:var(--gold); font-size:.65em; font-style:normal; }
    .ceremony { font-size:18px; letter-spacing:6px; text-transform:uppercase; }
    .divider { display:flex; align-items:center; gap:14px; max-width:320px; margin:28px auto; color:var(--gold); }
    .divider::before,.divider::after { content:""; height:1px; flex:1; background:#b9b39a; }
    .details { max-width:500px; margin:auto; }.date { font-size:25px; letter-spacing:2px; }.time { margin:8px 0 24px; font-size:20px; }
    .place { margin:18px auto; }.place strong { display:block; font-size:18px; letter-spacing:2px; text-transform:uppercase; }.place span { display:block; margin-top:5px; font-size:19px; font-style:italic; }
    .footer { margin-top:34px; font-size:15px; letter-spacing:3px; color:#777c66; text-transform:uppercase; }
    @media (max-height:650px) { .frame { padding-top:45px; padding-bottom:35px; } h1{font-size:58px} }
  </style>
</head>
<body>
  <main>
    <section class="opening" id="opening" role="button" tabindex="0" aria-label="Open invitation">
      <div class="envelope"><div class="flap"></div><div class="seal"><span>A&amp;A</span></div><div class="touch">Touch to open</div></div>
    </section>
    <section class="invite">
      <div class="frame">
        <div class="vine top" aria-hidden="true"><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i></div>
        <div class="vine bottom" aria-hidden="true"><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i><i class="leaf"></i></div>
        <p class="eyebrow">Together with their families</p>
        <h1>Anndriya Roselet San <em>&amp;</em> Arbin Joy</h1>
        <p class="ceremony">Betrothal Ceremony</p>
        <div class="divider">❧</div>
        <div class="details">
          <div class="date">02 January 2027</div>
          <div class="time">Saturday · 4:30 PM</div>
          <div class="place"><strong>Ceremony</strong><span>San Jose Church<br>Kelakam</span></div>
          <div class="place"><strong>Reception to Follow</strong><span>St. George Convention Centre<br>Kelakam</span></div>
        </div>
        <p class="footer">With love &amp; joy</p>
      </div>
    </section>
  </main>
  <script>
    const opening=document.getElementById('opening');
    function openInvitation(){ opening.classList.add('open'); setTimeout(()=>opening.style.display='none',800); }
    opening.addEventListener('click',openInvitation);
    opening.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' ')openInvitation();});
  </script>
</body>
</html>
